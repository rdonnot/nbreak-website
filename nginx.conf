server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # N'Der moved from /nder/ to /n-der/ (the N'Brain / N'Break naming). Browsers keep the #fragment across
    # the redirect, so an old sign-up link (/nder/welcome/#t=...) still works.
    # Relative Location: nginx sits behind Traefik's TLS and would otherwise answer with http://.
    absolute_redirect off;
    location ~ ^/nder(/.*)?$ {
        return 301 /n-der$1$is_args$args;
    }

    # Unknown paths (old LWS URLs included) land on the home page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
