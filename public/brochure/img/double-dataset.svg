<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">The digital double is one living dataset</title><desc id="d">Measurements from the real world update a shared project dataset. The 2D plan, 3D stage, LED pixel map, camera plates and show cues are connected views of the same data. The dataset can send precise numbers back to the real production.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171b31"/></linearGradient><linearGradient id="hub" x2="1" y2="1"><stop stop-color="#44366e"/><stop offset="1" stop-color="#201e3d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ecad64" stroke-width="2"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f5f3fa}.ey{fill:#acb6cf;font-size:18px;font-weight:800;letter-spacing:3px}.title{font-size:43px;font-weight:800}.sub{font-size:22px;fill:#c1cbdb}.head{font-size:23px;font-weight:800}.sm{font-size:17px;fill:#bdc5d9}.cap{font-size:19px;font-weight:750}.line{fill:none;stroke:#eba964;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.v{fill:none;stroke:#ac93f9;stroke-width:3;stroke-linecap:round}.box{fill:#1a2338;stroke:#626c8b;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="65" y="62" class="ey">N’BRAIN / THE DIGITAL DOUBLE</text><text x="65" y="122" class="title">One living dataset. Many production views.</text><text x="65" y="161" class="sub">Measure the real. Work in the double. Send precise decisions back.</text>
<text x="98" y="237" class="ey" fill="#ebaf6c">REAL WORLD / INPUT</text><text x="665" y="237" class="ey" fill="#ad94f9">SHARED TRUTH</text><text x="1114" y="237" class="ey" fill="#ebaf6c">CONNECTED VIEWS</text>
