<g transform="translate(91 385)"><rect width="335" height="85" rx="13" class="box"/><path d="M24 23 h65 v42 H24z M43 23 v42 M67 23 v42 M24 44 h65" class="line"/><text x="126" y="51" class="head">Plans / maps</text></g>
